# Handle the mouse wheel in tmux so it scrolls pane history.
set -g mouse on

# Paste tmux's buffer even when the application requests mouse input.
bind-key -n MouseDown2Pane select-pane -t = \; paste-buffer -p

# Keep more output for scrolling back in new windows and panes.
set -g history-limit 100000

# Reduce the Escape-key delay while allowing for key sequences over SSH.
set -s escape-time 50
